---
name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  check:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      # The submodule carries the pinned basalam library; recursive init is the
      # only mechanism, so a broken pin fails here instead of at link time.
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      # The compiler version is read from .salam-version, not repeated here:
      # one source for the pin, so CI cannot drift from the file.
      - name: Read the Salam pin
        id: pin
        run: echo "version=$(cat .salam-version)" >> "$GITHUB_OUTPUT"

      - name: Setup Salam
        uses: SalamLang/Salam/.github/actions/setup-salam@main
        with:
          version: ${{ steps.pin.outputs.version }}

      # A mismatch is a named failure, not a silent download of another compiler.
      - name: Assert the compiler matches the pin
        run: |
          installed="$(salam version | head -n 1 | awk '{print $2}')"
          installed="${installed#v}"
          pinned="$(cat .salam-version)"
          echo "installed=$installed pinned=$pinned"
          test "$installed" = "$pinned"

      - name: make fmt-check
        run: make fmt-check

      # LLVM strict: an LLVM codegen failure must not fall back to the C
      # backend, so no step here passes --backend=c or retries on failure.
      - name: make build
        run: make build

      - name: make test
        run: make test

  docs:
    runs-on: ubuntu-latest
    env:
      MINTLIFY_TELEMETRY_DISABLED: 1
    steps:
      # No submodules: the docs job validates the site only, not the library.
      - uses: actions/checkout@v4

      # The CLI version is read from .mint-version, not repeated here: one
      # source for the pin, so CI cannot drift from the Makefile.
      - name: Read the Mintlify pin
        id: mint
        run: echo "version=$(cat .mint-version)" >> "$GITHUB_OUTPUT"

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install the Mintlify CLI
        run: npm i -g "mint@${{ steps.mint.outputs.version }}"

      # The formatter must be idempotent: checkout is clean, so any rewrite
      # fails the gate; locally the same target needs the edits staged.
      - name: Check the docs format
        run: make docs-format-check

      # MDX and frontmatter validation, then the link and anchor check.
      - name: Check the docs
        run: make docs-check
